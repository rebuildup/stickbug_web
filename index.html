<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stick Bug clean-room asset lab</title><link rel="stylesheet" href="./style.css"></head>
<body><main><h1>Stick Bug clean-room asset lab</h1><p>This preview keeps the source meme's measured pacing and motion logic while replacing the logo, footage, melody and sound design with original generated material.</p>
<div id="stage" aria-label="visual preview"></div>
<div class="transport"><button id="play">Play</button><input id="timeline" type="range" min="0" value="0"><output id="time">0.000 s</output></div>
<section><h2>Separate assets</h2>
<div class="grid"><article><h3>Music</h3><audio controls src="./assets/music/stickbug-inspired-loop.wav"></audio></article><article><h3>Intro rise SFX</h3><audio controls src="./assets/sfx/intro-rise.wav"></audio></article><article><h3>Outline pop SFX</h3><audio controls src="./assets/sfx/outline-pop.wav"></audio></article><article><h3>Morph SFX</h3><audio controls src="./assets/sfx/morph.wav"></audio></article></div>
</section></main><script type="module" src="./src/app.mjs"></script></body></html>
